<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizador de array</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Visualizador de Métodos de Array</h1>
      <p id="status-operacao">Estado atual do Array</p>

      <div id="array-container" class="array-box"></div>

      <div class="controles">
        <button id="btn-map">Map</button>
        <button id="btn-filter">Filter</button>
        <button id="btn-find">Find</button>
        <button id="btn-reset" hidden>Reset</button>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
